<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="St Paul's Cathedral at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1420"/>
      <stop offset="42%" stop-color="#25293a"/>
      <stop offset="72%" stop-color="#5a4a3f"/>
      <stop offset="100%" stop-color="#8d6f4f"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc6"/>
      <stop offset="55%" stop-color="#c9b795"/>
      <stop offset="100%" stop-color="#8a795c"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2130"/>
      <stop offset="100%" stop-color="#11151f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="72%" r="46%">
      <stop offset="0%" stop-color="#f0d9a8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#f0d9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- distant skyline -->
  <g fill="url(#far)" opacity="0.9">
    <rect x="0" y="620" width="150" height="280"/>
    <rect x="140" y="668" width="120" height="232"/>
    <rect x="250" y="640" width="90" height="260"/>
    <rect x="1230" y="650" width="130" height="250"/>
    <rect x="1340" y="600" width="110" height="300"/>
    <rect x="1430" y="662" width="170" height="238"/>
  </g>

  <!-- cathedral -->
  <g fill="url(#stone)">
    <!-- west towers -->
    <rect x="600" y="560" width="52" height="270"/>
    <rect x="948" y="560" width="52" height="270"/>
    <path d="M600 560h52l-8-34h-36z"/>
    <path d="M948 560h52l-8-34h-36z"/>
    <rect x="612" y="500" width="28" height="30"/>
    <rect x="960" y="500" width="28" height="30"/>
    <circle cx="626" cy="494" r="10"/>
    <circle cx="974" cy="494" r="10"/>

    <!-- nave -->
    <rect x="596" y="700" width="408" height="130"/>
    <!-- portico -->
    <rect x="700" y="740" width="200" height="90"/>

    <!-- drum and colonnade -->
    <rect x="700" y="470" width="200" height="130"/>
    <g fill="#0f1420" opacity="0.35">
      <rect x="716" y="486" width="9" height="98"/>
      <rect x="746" y="486" width="9" height="98"/>
      <rect x="776" y="486" width="9" height="98"/>
      <rect x="806" y="486" width="9" height="98"/>
      <rect x="836" y="486" width="9" height="98"/>
      <rect x="866" y="486" width="9" height="98"/>
    </g>
    <rect x="688" y="596" width="224" height="16"/>
    <rect x="690" y="456" width="220" height="16"/>

    <!-- dome -->
    <path d="M706 462c0-104 44-166 94-166s94 62 94 166z"/>
    <!-- lantern -->
    <rect x="778" y="228" width="44" height="70"/>
    <path d="M778 228h44l-22-26z"/>
    <rect x="792" y="176" width="16" height="28"/>
    <circle cx="800" cy="166" r="11"/>
    <rect x="796" y="140" width="8" height="22"/>
    <path d="M800 128l7 14h-14z"/>
  </g>

  <!-- foreground haze -->
  <rect y="800" width="1600" height="100" fill="#0d1119" opacity="0.55"/>
</svg>
